name: Komendy
version: 1.0.0
main: pl.komendy.Komendy
api-version: "1.21"
loadbefore: [Essentials, EssentialsX]
author: you
description: Proste komendy /tp, /gm, /fly i /flyspeed

commands:
  tp:
    description: Teleportuje do gracza lub na koordynaty
    usage: /tp <nick> | /tp <nick> <nick2> | /tp <x> <y> <z> | /tp <nick> <x> <y> <z>
    permission: komendy.tp
  gm:
    description: Zmienia tryb gry (0-3)
    usage: /gm <0|1|2|3> [nick]
    permission: komendy.gm
  fly:
    description: Wlacza lub wylacza latanie
    usage: /fly [nick]
    permission: komendy.fly
  flyspeed:
    description: Ustawia predkosc latania (1-10)
    usage: /flyspeed <1-10> [nick]
    permission: komendy.flyspeed
  msg:
    description: Wysyla prywatna wiadomosc
    usage: /msg <nick> <wiadomosc>
    aliases: [tell, w, m, whisper, pm]
    permission: komendy.msg
  r:
    description: Odpowiada na ostatnia prywatna wiadomosc
    usage: /r <wiadomosc>
    aliases: [reply]
    permission: komendy.r
  repair:
    description: Naprawia przedmiot w rece albo wszystkie (all)
    usage: /repair | /repair all
    permission: komendy.repair
  ban:
    description: Banuje gracza na stale
    usage: /ban <nick> [powod]
    permission: komendy.ban
  banip:
    description: Banuje adres IP na stale
    usage: /banip <nick|ip> [powod]
    aliases: [ban-ip]
    permission: komendy.banip
  tempban:
    description: Banuje gracza na czas
    usage: /tempban <nick> <czas> [powod]
    permission: komendy.tempban
  tempbanip:
    description: Banuje adres IP na czas
    usage: /tempbanip <nick|ip> <czas> [powod]
    permission: komendy.tempbanip
  unban:
    description: Zdejmuje bana (nick lub IP)
    usage: /unban <nick|ip>
    aliases: [unbanip, pardon, pardon-ip]
    permission: komendy.unban
  mute:
    description: Wycisza gracza na stale
    usage: /mute <nick> [powod]
    permission: komendy.mute
  tempmute:
    description: Wycisza gracza na czas
    usage: /tempmute <nick> <czas> [powod]
    permission: komendy.tempmute
  tempmuteip:
    description: Wycisza adres IP na czas
    usage: /tempmuteip <nick|ip> <czas> [powod]
    permission: komendy.tempmuteip
  unmute:
    description: Zdejmuje wyciszenie (nick lub IP)
    usage: /unmute <nick|ip>
    permission: komendy.unmute

permissions:
  komendy.tp:
    description: Uzywanie /tp
    default: op
  komendy.gm:
    description: Uzywanie /gm
    default: op
  komendy.gm.others:
    description: /gm na innych graczach
    default: op
  komendy.fly:
    description: Uzywanie /fly
    default: op
  komendy.fly.others:
    description: /fly na innych graczach
    default: op
  komendy.flyspeed:
    description: Uzywanie /flyspeed
    default: op
  komendy.flyspeed.others:
    description: /flyspeed na innych graczach
    default: op
  komendy.msg:
    description: Uzywanie /msg
    default: true
  komendy.r:
    description: Uzywanie /r
    default: true
  komendy.repair:
    description: Uzywanie /repair (przedmiot w rece)
    default: op
  komendy.repair.all:
    description: Uzywanie /repair all
    default: op
  komendy.ban:
    description: Uzywanie /ban
    default: op
  komendy.banip:
    description: Uzywanie /banip
    default: op
  komendy.tempban:
    description: Uzywanie /tempban
    default: op
  komendy.tempbanip:
    description: Uzywanie /tempbanip
    default: op
  komendy.unban:
    description: Uzywanie /unban
    default: op
  komendy.mute:
    description: Uzywanie /mute
    default: op
  komendy.tempmute:
    description: Uzywanie /tempmute
    default: op
  komendy.tempmuteip:
    description: Uzywanie /tempmuteip
    default: op
  komendy.unmute:
    description: Uzywanie /unmute
    default: op
